<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatchHire - Sem Bordas e Com Profundidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <main id="main-content" class="flex-grow-1 d-flex flex-column pt-5 mt-5 mt-md-4">

        <div class="container-fluid pt-3 pb-0 pe-0 ps-3 ps-md-4 d-flex flex-column flex-grow-1">

            <div class="p-4 p-md-5 shadow-lg text-white d-flex flex-column flex-grow-1 justify-content-center"
                style="background-image: linear-gradient(45deg, #162417 0%, #2a402c 100%); border-radius: 0; border-top-left-radius: 30px;">

                <div class="row w-100 justify-content-center mx-0">
                    <div class="col-12 px-0">



                        <div class="tab-content" id="pills-tabContent-login">

                            <div class="tab-pane fade show active" id="pills-login-empresa" role="tabpanel"
                                aria-labelledby="pills-login-empresa-tab">
                                <div class="p-4 p-md-5 text-dark shadow-lg login-card cor-fundo">
                                    <div class="text-center mb-4">
                                        <div class="mb-3">
                                            <i class="bi bi-key-fill" style="font-size: 3.5rem; color: #162417;"></i>
                                        </div>
                                        <h2 class="fw-bold font-georgia mb-2" style="color: #162417;">Esqueceu sua
                                            senha?
                                        </h2>
                                        <p class="text-dark opacity-75 small">Mude sua senha através do email.
                                        </p>
                                    </div>

                                    <form action="/login" method="POST">
                                        <input type="hidden" name="tipo_usuario" value="empresa">

                                        <div class="mb-3">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <i class="bi bi-envelope me-2"></i>Informe seu Email
                                            </label>
                                            <input type="email" name="email" class="form-control form-control-custom"
                                                placeholder="rh@empresa.com" required>
                                        </div>

                                        <div class="mb-2">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <p>Você recebera através do email um formulário para a mudança de senha.
                                                </p>
                                            </label>
                                        </div>

                                        <button class="btn-primeiro rounded-5 w-100 fs-5 py-2 mb-4"
                                            onclick="mostrarMensagem()">
                                            Recuperar Senha
                                        </button>

                                        <div class="text-center mt-2 border-top border-dark border-opacity-10 pt-4">
                                            <p class="mb-0 text-dark small">
                                                Sua empresa ainda não tem conta? <br>
                                                <a href="CadastrarCandidato.html"
                                                    class="link-custom mt-1 d-inline-block"><i
                                                        class="bi bi-box-arrow-in-right me-1"></i>Cadastre-se aqui</a>
                                            </p>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <div class="tab-pane fade" id="pills-login-candidato" role="tabpanel"
                                aria-labelledby="pills-login-candidato-tab">
                                <div class="p-4 p-md-5 text-dark shadow-lg login-card cor-fundo">
                                    <div class="text-center mb-4">
                                        <div class="mb-3">
                                            <i class="bi bi-person-circle"
                                                style="font-size: 3.5rem; color: #162417;"></i>
                                        </div>
                                        <h2 class="fw-bold font-georgia mb-2" style="color: #162417;">Acesso do
                                            Candidato</h2>
                                        <p class="text-dark opacity-75 small">Acesse seu perfil e encontre a vaga ideal.
                                        </p>
                                    </div>

                                    <form action="/login" method="POST">
                                        <input type="hidden" name="tipo_usuario" value="candidato">

                                        <div class="mb-3">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <i class="bi bi-envelope me-2"></i>E-mail Pessoal
                                            </label>
                                            <input type="email" name="email" class="form-control form-control-custom"
                                                placeholder="seuemail@provedor.com" required>
                                        </div>

                                        <div class="mb-4">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <i class="bi bi-lock me-2"></i>Senha
                                            </label>
                                            <input type="password" name="senha" class="form-control form-control-custom"
                                                placeholder="Digite sua senha" required>
                                        </div>

                                        <div class="d-flex justify-content-between align-items-center mb-4 small">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value=""
                                                    id="lembrarCandidato"
                                                    style="cursor: pointer; border-color: #162417;">
                                                <label class="form-check-label text-dark fw-medium"
                                                    for="lembrarCandidato" style="cursor: pointer;">
                                                    Lembrar de mim
                                                </label>
                                            </div>
                                            <a href="/recuperar-senha" class="link-custom">Esqueceu a senha?</a>
                                        </div>

                                        <button type="submit"
                                            class="btn-primeiro rounded-5 w-100 fs-5 py-2 mb-4 bnt-primeiro">Entrar como
                                            Candidato</button>

                                        <div class="text-center mt-2 border-top border-dark border-opacity-10 pt-4">
                                            <p class="mb-0 text-dark small">
                                                Ainda não tem o seu perfil? <br>
                                                <a href="CadastrarCandidato.html"
                                                    class="link-custom mt-1 d-inline-block"><i
                                                        class="bi bi-box-arrow-in-right me-1"></i>Cadastre-se aqui</a>
                                            </p>
                                        </div>
                                    </form>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
function mostrarMensagem() {
    const mensagem = document.createElement("div");

    mensagem.innerHTML = `
        <div style="
            position: fixed;
            top: 20px;
            right: 20px;
            background: #198754;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,.2);
            z-index: 9999;
        ">
            Confira seu e-mail para mudar a senha.
        </div>
    `;

    document.body.appendChild(mensagem);

    setTimeout(() => {
        mensagem.remove();
    }, 3000);
}
</script>
</body>

</html>
