<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MatchHire - Sem Bordas e Com Profundidade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar fixed-top shadow-sm py-2 cor-fundo" style="z-index: 1050;">
        <div class="container-fluid d-flex align-items-center justify-content-between px-3 px-md-4">

            <div class="d-flex align-items-center gap-2 flex-fill">
                <button class="btn btn-outline-dark border-0 fs-4 d-md-none" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center fs-3 m-0 p-0 texto-escuro" href="#">
                    Match<span class="text-white">Hire</span>
                    <img src="imagem/logo.png" class="ms-2 d-none d-sm-block img-fluid" style="height: 40px;" alt="">
                </a>
            </div>

            <div class="text-center d-none d-md-block flex-fill">
                <a href="HomeSemCadastro.html" class="fs-2 fw-bold text-decoration-none texto-escuro">HOME</a>
            </div>


            <div class="d-flex align-items-center justify-content-end flex-fill gap-3">
                <a href="entrar.html" class="btn btn-primeiro rounded-5 px-4 py-2 fw-semibold d-none d-sm-block">
                    Entrar
                </a>
                <a href="CadastrarCandidato.html" class="btn btn-primeiro rounded-5 px-4 py-2 fw-semibold d-none d-sm-block">
                    Cadastre-se
                </a>

                <button class="border-0 bg-transparent p-0 shadow-none d-sm-none texto-escuro fs-1" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#sidebarConta">
                    <i class="bi bi-person-circle"></i>
                </button>
            </div>

            <div class="offcanvas offcanvas-end bg-menu" tabindex="-1" id="sidebarConta">
                <div class="offcanvas-header border-custom-menu">
                    <h5 class="offcanvas-title fw-bold texto-escuro">
                        Minha Conta
                    </h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas">
                    </button>
                </div>
                <div class="offcanvas-body d-flex flex-column gap-3 pt-4">
                    <a href="entrar.html" class="btn btn-primeiro rounded-5 py-3 fw-semibold">
                        Entrar
                    </a>
                    <a href="CadastrarCandidato.html" class="btn btn-primeiro rounded-5 py-3 fw-semibold">
                        Cadastre-se
                    </a>
                </div>
            </div>

        </div>
        </div>
    </nav>
    <aside id="sidebar" class="offcanvas-md offcanvas-start bg-menu shadow position-fixed top-0 start-0 h-100 border-0"
        tabindex="-1">

        <div class="offcanvas-header d-md-none border-bottom border-dark border-opacity-10 mt-2">
            <h5 class="offcanvas-title texto-escuro fw-bold fs-3">Menu</h5>
            <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column p-0 h-100 overflow-x-hidden">

            <div class="px-3 mt-4 mb-2 hide-on-collapse">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-transparent border-end-0 text-muted"
                        style="border-color: #162417;"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control bg-transparent border-start-0 ps-0 shadow-none "
                        style="border-color: #162417;" placeholder="Buscar...">
                </div>
            </div>

            <div class="px-4 mt-3 mb-2 text-uppercase fw-bold text-muted small hide-on-collapse">Menu Principal</div>

            <nav class="nav flex-column gap-1 p-2 flex-grow-1">
                <a href="HomeSemCadastro.html"
                    class="nav-link d-flex align-items-center texto-escuro fw-medium rounded py-2 link-hover">
                    <div class="text-center" style="min-width: 40px;"><i class="bi bi-house-fill fs-5"></i></div>
                    <span class="hide-on-collapse ms-2">Home</span>
                </a>

                <a href="VagasSemCadastro.html"
                    class="nav-link d-flex align-items-center justify-content-between texto-escuro fw-medium rounded py-2 link-hover">
                    <div class="d-flex align-items-center">
                        <div class="text-center" style="min-width: 40px;"><i class="bi bi-person-badge fs-5"></i></div>
                        <span class="hide-on-collapse ms-2">Vagas</span>
                    </div>
                </a>
            </nav>

        </div>
    </aside>
    <main id="main-content" class="flex-grow-1 d-flex flex-column pt-5 mt-5 mt-md-4">
        <div class="container-fluid pt-3 pb-0 pe-0 ps-3 ps-md-4 d-flex flex-column flex-grow-1">
            <div class="p-4 p-md-5 shadow-lg text-white d-flex flex-column flex-grow-1 justify-content-center"
                style="background-image: linear-gradient(45deg, #162417 0%, #2a402c 100%); border-radius: 0; border-top-left-radius: 30px;">

                <div class="row w-100 justify-content-center mx-0">
                    <div class="col-12 px-0">

                        <div class="tab-content" id="pills-tabContent-login">
                            <div class="tab-pane fade show active" id="pills-login-empresa" role="tabpanel"
                                aria-labelledby="pills-login-empresa-tab">
                                <div class="p-4 p-md-5 text-dark shadow-lg login-card cor-fundo">
                                    
                                    <div class="text-center mb-4">
                                        <div class="mb-3">
                                            <i class="bi bi-key-fill" style="font-size: 3.5rem; color: #162417;"></i>
                                        </div>
                                        <h2 class="fw-bold font-georgia mb-2" style="color: #162417;">Esqueceu sua senha?</h2>
                                        <p class="text-dark opacity-75 small">Mude sua senha através do email.</p>
                                    </div>

                                    <form action="/login" method="POST">
                                        <input type="hidden" name="tipo_usuario" value="empresa">

                                        <div class="mb-3">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <i class="bi bi-envelope me-2"></i>Informe seu Email
                                            </label>
                                            <input type="email" id="email" class="form-control form-control-custom"
                                                placeholder="Digite seu e-mail">
                                        </div>

                                        <div class="mb-2">
                                            <label class="form-label fw-medium" style="color: #162417;">
                                                <p>Você receberá através do email um formulário para a mudança de senha.</p>
                                            </label>
                                        </div>

                                        <button type="button" class="btn-primeiro rounded-5 w-100 fs-5 py-2 mb-4"
                                            onclick="mostrarMensagem()">
                                            Recuperar Senha
                                        </button>

                                        <div class="text-center mt-2 border-top border-dark border-opacity-10 pt-4">
                                            <p class="mb-0 text-dark small">
                                                Sua empresa ainda não tem conta? <br>
                                                <a href="CadastrarCandidato.html" class="link-custom mt-1 d-inline-block">
                                                    <i class="bi bi-box-arrow-in-right me-1"></i>Cadastre-se aqui
                                                </a>
                                            </p>
                                        </div>
                                    </form>

                                </div>
                            </div>
                        </div> </div>
                </div> </div>
        </div> </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function mostrarMensagem() {
            const email = document.getElementById("email").value;

            if (email.trim() === "") {
                alert("Digite seu e-mail antes de continuar.");
                return;
            }

            const mensagem = document.createElement("div");
            mensagem.innerHTML = `
                <div style="
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #17B890;
                    color: white;
                    padding: 15px 20px;
                    border-radius: 10px;
                    box-shadow: 0 4px 10px rgba(0,0,0,.2);
                    z-index: 9999;
                ">
                    Confira seu e-mail para mudar a senha.
                </div>
            `;

            document.body.appendChild(mensagem);

            setTimeout(() => {
                window.location.href = "entrar.html";
            }, 3000);
        }
    </script>
</body>

</html>
